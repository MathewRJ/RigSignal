name: cgroup-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cgroup-probe:
    name: cgroup-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Runner evidence
        run: |
          uname -r
          grep cgroup2 /proc/mounts || true
          cat /proc/self/cgroup
          id
      - name: Measure cgroup delegation
        run: python3 packaging/tests/probe-cgroup-delegation.py
