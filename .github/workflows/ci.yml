name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Push runs are grouped by COMMIT, not by ref, so no push can contend with
# another.  Grouping every main push together lost gate conclusions two ways:
# cancel-in-progress cancelled the running one, and GitHub keeps only a single
# pending run per group, so a third arrival cancelled the queued one as well.
# On 2026-09-10 three merges landed within 17 seconds and neither non-final
# merge commit got a usable conclusion, in two different ways: 1836839e's run
# was cancelled but its ci-gate job still completed as FAILURE, because 7 of
# its 9 needs were cancelled and the gate rejects any non-success result -- a
# false red now permanent in main's history, on a commit whose own pre-merge
# run was green.  9dce7563's run was cancelled before any job started, leaving
# no conclusion at all.  A burst on main does not merely lose conclusions, it
# manufactures them.  Every other event keeps ref-grouping with cancellation,
# which is what makes a superseded PR push stop burning a runner.
# release.yml:29 takes the same no-cancel position for tags.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  stable-canary:
    name: stable-canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install floating stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: cargo check (floating stable)
        run: cargo +stable check --manifest-path src/Cargo.toml --locked

      - name: cargo clippy (floating stable)
        run: cargo +stable clippy --manifest-path src/Cargo.toml --locked --all-targets -- -D warnings

  packaging-tests:
    name: packaging tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # DIAGNOSTIC ONLY, no behaviour depends on it. Authorised by Central
      # 2026-09-11 to establish the runner kernel, after a round-6 review
      # falsified an inferred kernel claim by construction: a held pidfd does
      # NOT reserve the pid number (free_pid removes the IDR entry before the
      # reference release), so a numeric killpg can reach a recycled group.
      # The replacement is identity-based group signalling, which needs
      # PIDFD_SIGNAL_PROCESS_GROUP (Linux 6.9+). This PROBES the flag rather
      # than inferring support from a version string -- inferring is the exact
      # error that produced this step. Remove once the answer is recorded.
      - name: Diagnostic - runner kernel and pidfd group-signal support
        run: |
          uname -r
          python3 - <<'PROBE'
          import ctypes, os, signal, subprocess, sys, time
          PIDFD_SIGNAL_PROCESS_GROUP, SYS_pidfd_send_signal = 4, 424
          libc = ctypes.CDLL(None, use_errno=True)
          print('kernel:', os.uname().release)
          if not hasattr(os, 'pidfd_open'):
              print('RESULT: pidfd_open UNAVAILABLE'); sys.exit(0)
          child = subprocess.Popen(['sh', '-c', 'sleep 30 & echo "$!" > pg.pid; wait'],
                                   start_new_session=True)
          fd = os.pidfd_open(child.pid)
          limit = time.monotonic() + 5
          while not os.path.exists('pg.pid') and time.monotonic() < limit:
              time.sleep(0.005)
          grandchild = int(open('pg.pid').read())
          print('launcher', child.pid, 'grandchild', grandchild,
                'same pgid:', os.getpgid(child.pid) == os.getpgid(grandchild))
          ctypes.set_errno(0)
          rc = libc.syscall(SYS_pidfd_send_signal, ctypes.c_int(fd),
                            ctypes.c_int(signal.SIGKILL), None,
                            ctypes.c_uint(PIDFD_SIGNAL_PROCESS_GROUP))
          err = ctypes.get_errno()
          print('pidfd_send_signal(PROCESS_GROUP) rc=%d errno=%d' % (rc, err))
          time.sleep(0.2)
          def alive(pid):
              try:
                  return open('/proc/%d/stat' % pid).read().rsplit(') ', 1)[1].split(' ', 1)[0] != 'Z'
              except FileNotFoundError:
                  return False
          print('after: launcher alive=%s grandchild alive=%s' % (alive(child.pid), alive(grandchild)))
          print('RESULT: PIDFD_SIGNAL_PROCESS_GROUP',
                'SUPPORTED' if rc == 0 else 'UNSUPPORTED errno=%d' % err)
          for killer, target in ((os.killpg, child.pid), (os.kill, grandchild)):
              try: killer(target, signal.SIGKILL)
              except OSError: pass
          child.wait(); os.close(fd)
          PROBE

      - name: Check release version consistency
        run: python3 tools/check-release-version

      - name: Test release version guard
        if: '!cancelled()'
        run: python3 tools/tests/test_check_release_version.py

      - name: Test release manifest generator
        if: '!cancelled()'
        run: python3 tools/tests/test_gen_release_manifest.py

      - name: Test release-verification window
        if: '!cancelled()'
        run: bash tools/tests/test_verify_release_window.sh

      - name: Run installer packaging tests
        if: '!cancelled()'
        run: bash tools/tests/test_installer.sh

      - name: Run launcher packaging tests
        if: '!cancelled()'
        run: bash packaging/tests/test-rigsignal-launcher.sh

      - name: Run assets launcher packaging tests
        if: '!cancelled()'
        run: bash packaging/tests/test-assets-launcher.sh

      - name: Run assets-only ownership tests
        if: '!cancelled()'
        run: python3 tools/tests/test_assets_only.py

  ebpf-workspace:
    name: eBPF workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # `working-directory` is load-bearing: rustup resolves rust-toolchain.toml
      # CWD-upward, so running this from the repo root would pick the root 1.98.0 pin
      # instead of ebpf/'s nightly (which the probes crate needs for build-std).
      - name: Run eBPF workspace tests
        working-directory: ebpf
        run: cargo test --locked

  enrollment-tail-root:
    name: enrollment tail tests (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run enrollment tail tests as root
        run: |
          set -o pipefail
          sudo python3 tools/tests/test_enrollment_tail.py -v 2>&1 | tee enrollment-tail-root.log
          grep -E 'test_foreign_owned_outbox_refuses.* \.\.\. ok$' enrollment-tail-root.log
          sudo env RIGSIGNAL_FD1_TMPDIR="${{ runner.temp }}" python3 -m unittest tools.tests.test_fd1_packaged_main -v 2>&1 | tee fd1-packaged-main-root.log
          grep -E 'test_s7_fd2a_real_foreign_root_refuses_at_preflight_before_any_root_mutation.* \.\.\. ok$' fd1-packaged-main-root.log

  python-discovery:
    name: Python enrollment discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run full Python discovery
        run: python3 -m unittest discover -s tools/tests

      - name: Run shuffled Python discovery
        if: '!cancelled()'
        run: python3 tools/tests/run_shuffled.py --seed 20260826

      - name: Run fd publication tests directly
        if: '!cancelled()'
        run: python3 tools/tests/test_asset_tools.py

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (pinned 1.98.0)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          # The workspace is the ROOT Cargo.toml (members = ["src"]), so Cargo's
          # shared build directory is the root `target` -- which is also what the
          # binary upload and the smoke test read from.  `src -> target` joined to
          # `src/target`, a directory Cargo never builds into, and looked for a
          # lockfile under src/ that does not exist (Cargo.lock is at the root).
          # A cache restore REPORTS SUCCESS when it restores an empty directory,
          # so this was green for as long as it was wrong.
          workspaces: . -> target
          key: ${{ matrix.os }}

      - name: cargo check
        run: cargo check --manifest-path src/Cargo.toml --locked

      - name: cargo clippy
        run: cargo clippy --manifest-path src/Cargo.toml --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src/Cargo.toml --locked

      - name: cargo check --features ebpf (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path src/Cargo.toml --locked --features ebpf

      - name: cargo clippy --features ebpf (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --manifest-path src/Cargo.toml --locked --all-targets --features ebpf -- -D warnings

      - name: Build release binary (windows only)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --manifest-path src/Cargo.toml --locked

      - name: Upload windows agent binary artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rigsignal-agent-windows
          # Workspace root Cargo.toml puts binaries in the root target dir.
          path: target/release/rigsignal-agent.exe
          if-no-files-found: error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (pinned 1.98.0, rustfmt)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src/Cargo.toml -- --check

  smoke-test:
    name: smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (pinned 1.98.0)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          # The workspace is the ROOT Cargo.toml (members = ["src"]), so Cargo's
          # shared build directory is the root `target` -- which is also what the
          # binary upload and the smoke test read from.  `src -> target` joined to
          # `src/target`, a directory Cargo never builds into, and looked for a
          # lockfile under src/ that does not exist (Cargo.lock is at the root).
          # A cache restore REPORTS SUCCESS when it restores an empty directory,
          # so this was green for as long as it was wrong.
          workspaces: . -> target
          key: ubuntu-smoke

      - name: Build agent (debug)
        run: cargo build --manifest-path src/Cargo.toml --locked

      - name: Run smoke test
        run: bash scripts/smoke-test.sh ./target/debug/rigsignal-agent

  # ---------------------------------------------------------------------------
  # Dashboard NDJSON hygiene
  # No instance tokens may leak into committed dashboards.
  # ---------------------------------------------------------------------------
  dashboard-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for instance tokens in dashboards
        run: |
          fail=0
          shopt -s nullglob
          files=()
          for dir in kibana/dashboard dashboards dashboards/archive; do
            [[ -d "$dir" ]] || continue
            for f in "$dir"/*.json "$dir"/*.ndjson; do
              [[ -f "$f" ]] && files+=("$f")
            done
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no dashboard files found; skipping"
            exit 0
          fi
          for f in "${files[@]}"; do
            for field in '"version":' '"created_at":' '"updated_at":' \
                         '"created_by":' '"updated_by":'; do
              if grep -q "${field}" "${f}"; then
                echo "::error file=${f}::contains instance token ${field}"
                fail=1
              fi
            done
          done
          exit $fail

  fixture-hygiene:
    name: fixture-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check fixtures for host fingerprints
        run: python3 scripts/check-fixture-fingerprints.py

  # Single aggregate check for branch protection to require. Deliberately an
  # ALLOWLIST ("every result must be exactly success"), not a denylist of
  # failure/cancelled -- the deleted pr-gate job denylisted, so a `skipped`
  # upstream job reported "all required jobs passed". It also asserts the
  # expected COUNT, so removing a job from `needs` fails the gate instead of
  # silently shrinking it.
  # stable-canary is intentionally NOT a dependency: it is schedule-only and
  # would be `skipped` on every push.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - packaging-tests
      - ebpf-workspace
      - enrollment-tail-root
      - python-discovery
      - check
      - fmt
      - smoke-test
      - dashboard-hygiene
      - fixture-hygiene
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          EXPECTED: "9"
        run: |
          set -euo pipefail
          echo "upstream results: ${RESULTS}"
          IFS=',' read -ra got <<< "${RESULTS}"
          if [[ "${#got[@]}" -ne "${EXPECTED}" ]]; then
            echo "::error::expected ${EXPECTED} upstream results, got ${#got[@]} -- a required job was removed from needs"
            exit 1
          fi
          for r in "${got[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::upstream job result '${r}' is not success"
              exit 1
            fi
          done
          echo "all ${EXPECTED} required jobs succeeded"
