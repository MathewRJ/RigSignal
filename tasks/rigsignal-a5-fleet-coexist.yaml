goal: >
  Implement the RATIFIED Amendment A5 `--ownership-profile fleet-coexist` installer mode. The
  full authoritative contracts are tasks/a5/FLEET-COEXISTENCE-AMENDMENT.md (the amendment,
  ratified DRAFT v3 — ownership table §1, flag/mode spec §2, verification additions §3, gate
  requirements §4, transport addendum §5 — OUT OF SCOPE for this task, see Non-goals below,
  credential restriction §6, cluster-health gate §7, A4 proof-deletion exception §8, all
  RATIFIED per the doc's own Ratification block) and tasks/a5/ROLLBACK-DESIGN.md (the v3 apply/
  rollback design — class adapter module §1, rollback scope §2, deferred/verify-only classes §3,
  logs-rigsignal.stream disposition §4, transaction journal §5, phase-gated runbook §6). Read
  both fully before writing any code; where this YAML and the contracts disagree, the contracts
  control. Base SHA for this work is current main HEAD
  0d427d37c277ae7fdc8df35503cbedab8a25692f (bundle sha256
  aa57aade36993ea143717c62366942ea736c1bf4235f0952c3cd86c49ece323a per BINARY-PROVENANCE.md —
  this task's own diff produces a NEW code SHA and a NEW bundle hash, per the amendment §4.3;
  do not claim the base hash as your own artifact's hash). Session id for any STM notes:
  2026-07-24e-a5-impl. Commit your work on the worktree branch only; do not commit outside this
  worktree, do not bump cargo/package version, and do not touch Rust source (see the Rust
  acceptance criterion below).

  Scope note: this task implements the installer mode, the class-adapter module, the journal,
  the marker, and the clean-stack gate script's scenario legs. It does NOT implement or touch
  the §5 transport addendum (TLS loopback proxy, `:5601` block) — that is a separate,
  owner-host deployment task, explicitly out of scope here (see Non-goals). It also does NOT
  perform any live invocation against the owner cluster `192.0.2.174` — all new legs run
  against ephemeral clean-stack Docker containers, exactly like the existing adoption-gate.sh
  pattern.

